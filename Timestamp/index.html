<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unix Timestamp to IST Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .converter-card {
            background-color: #2a2a44;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #3a3a5e;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 2rem;
        }
        .converter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #84aaff;
            margin-bottom: 0.5rem;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1rem;
            color: #c0c0d0;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #c0c0d0;
            margin-bottom: 0.5rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #1e1e3b;
            border: 1px solid #3a3a5e;
            border-radius: 0.75rem;
            color: #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #84aaff;
            box-shadow: 0 0 0 3px rgba(132, 170, 255, 0.3);
        }
        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: #1e1e3b;
            border: 1px dashed #4e4e7e;
            border-radius: 0.75rem;
        }
        .result-box h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 0.5rem;
        }
        .result-box p {
            font-size: 1.5rem;
            font-weight: 700;
            color: #84aaff;
            word-wrap: break-word; /* To handle long timestamps */
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="converter-card">
        <h1>Unix Timestamp to IST</h1>
        <p>Enter a Unix timestamp to convert it to Indian Standard Time (IST).</p>

        <div class="input-group">
            <label for="timestamp">Unix Timestamp</label>
            <input type="number" id="timestamp" placeholder="e.g., 1672531200" min="0">
        </div>

        <div id="result" class="result-box hidden">
            <h2>Converted IST Time</h2>
            <p id="istTime">Waiting for conversion...</p>
        </div>
    </div>

    <div class="converter-card">
        <h1>Difference Calculator</h1>
        <p>Calculate the difference between two Unix timestamps in minutes.</p>

        <div class="input-group">
            <label for="timestamp1">Timestamp 1</label>
            <input type="number" id="timestamp1" placeholder="e.g., 1672531200" min="0">
        </div>

        <div class="input-group">
            <label for="timestamp2">Timestamp 2</label>
            <input type="number" id="timestamp2" placeholder="e.g., 1672534800" min="0">
        </div>

        <div id="differenceResult" class="result-box hidden">
            <h2>Time Difference</h2>
            <p id="differenceTime">Waiting for calculation...</p>
        </div>
    </div>

    <script>
        document.getElementById('timestamp').addEventListener('input', convertTimestamp);
        document.getElementById('timestamp1').addEventListener('input', calculateDifference);
        document.getElementById('timestamp2').addEventListener('input', calculateDifference);

        /**
         * Converts a Unix timestamp to a human-readable IST time string.
         * The function first validates the input, then determines if it's in
         * seconds or milliseconds based on its length. It then creates a new Date object
         * and formats the date using the 'en-IN' locale and 'Asia/Kolkata'
         * time zone to ensure the output is in IST. The result is then displayed
         * in the designated HTML element.
         */
        function convertTimestamp() {
            const timestampInput = document.getElementById('timestamp');
            const resultBox = document.getElementById('result');
            const istTimeElement = document.getElementById('istTime');

            // Get the value and convert to a number
            let timestamp = Number(timestampInput.value);

            // Hide the result box if the input is empty or invalid
            if (timestampInput.value === '' || isNaN(timestamp) || timestamp <= 0) {
                resultBox.classList.add('hidden');
                istTimeElement.textContent = "Waiting for conversion...";
                resultBox.style.borderColor = '#4e4e7e'; // Reset border color
                return;
            }

            // Determine if the timestamp is in milliseconds (usually 13 digits) or seconds (10 digits)
            // and adjust accordingly.
            if (timestamp.toString().length === 13) {
                // The timestamp is in milliseconds, so no conversion is needed
            } else if (timestamp.toString().length === 10) {
                // The timestamp is in seconds, so we multiply by 1000 to get milliseconds
                timestamp *= 1000;
            } else {
                // Handle other lengths, assuming they are invalid
                istTimeElement.textContent = "Invalid timestamp format.";
                resultBox.classList.remove('hidden');
                resultBox.style.borderColor = '#ff6b6b'; // Highlight error
                return;
            }

            // Create a new Date object from the adjusted timestamp
            const date = new Date(timestamp);

            // Format the date to Indian Standard Time (IST)
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short',
                timeZone: 'Asia/Kolkata' // 'Asia/Kolkata' is the IANA time zone for IST
            };

            // Use toLocaleString with the specified options to get the IST formatted string
            const istString = date.toLocaleString('en-IN', options);

            // Update the HTML with the result
            istTimeElement.textContent = istString;
            resultBox.classList.remove('hidden');
            resultBox.style.borderColor = '#4e4e7e'; // Reset border color on success
        }

        /**
         * Calculates the difference between two Unix timestamps and displays the result in minutes.
         * The function gets the values from two input fields, converts them to milliseconds
         * if they are in seconds, and then calculates the absolute difference. The difference
         * is then converted to minutes and displayed with two decimal places.
         */
        function calculateDifference() {
            const timestamp1Input = document.getElementById('timestamp1');
            const timestamp2Input = document.getElementById('timestamp2');
            const differenceResultBox = document.getElementById('differenceResult');
            const differenceTimeElement = document.getElementById('differenceTime');

            let timestamp1 = Number(timestamp1Input.value);
            let timestamp2 = Number(timestamp2Input.value);

            // Hide result box if either input is empty or invalid
            if (timestamp1Input.value === '' || timestamp2Input.value === '' || isNaN(timestamp1) || isNaN(timestamp2) || timestamp1 <= 0 || timestamp2 <= 0) {
                differenceResultBox.classList.add('hidden');
                differenceTimeElement.textContent = "Waiting for calculation...";
                return;
            }

            // Function to normalize timestamp to milliseconds
            const normalizeTimestamp = (ts) => {
                if (ts.toString().length === 10) {
                    return ts * 1000;
                }
                return ts;
            };

            const ts1 = normalizeTimestamp(timestamp1);
            const ts2 = normalizeTimestamp(timestamp2);

            // Calculate the absolute difference in milliseconds
            const diffInMilliseconds = Math.abs(ts1 - ts2);

            // Convert milliseconds to minutes
            const diffInMinutes = diffInMilliseconds / (1000 * 60);

            // Display the result formatted to two decimal places
            differenceTimeElement.textContent = `${diffInMinutes.toFixed(2)} minutes`;
            differenceResultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
